<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
    background: #000;
    overflow-x: hidden;
}

body {
    font-family: 'Pacifico', cursive;
}

/* Floating Pink Title */
.title {
    position: fixed;
    top: 15px;
    width: 100%;
    text-align: center;
    font-size: 65px;
    color: #ff4da6;
    text-shadow: 0 0 25px rgba(255, 20, 147, 0.9);
    z-index: 1000;
    animation: float 3s ease-in-out infinite;
    pointer-events: none;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

/* Fullscreen Sections */
.section {
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    display: flex;
}

/* Make image fully cover screen (no gaps between sections) */
.section img {
    width: 100%;
    height: 100%;
    object-fit: cover;  /* fills screen completely */
    display: block;
}

/* Mobile title size */
@media (max-width: 768px) {
    .title {
        font-size: 42px;
    }
}
</style>
</head>
