<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
}

body {
    background: #111; /* clean background for PC side spaces */
    font-family: 'Pacifico', cursive;
    overflow-x: hidden;
}

/* Floating Pink Title */
.title {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 65px;
    color: #ff4da6;
    text-shadow: 0 0 20px rgba(255, 20, 147, 0.8);
    z-index: 1000;
    animation: float 3s ease-in-out infinite;
    pointer-events: none;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

/* Fullscreen Scroll Sections */
.section {
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    animation: fadeIn 1s ease forwards;
}

.section img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;   /* NO CROPPING */
}

/* Smooth fade effect */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Mobile */
@media (max-width: 768px) {
    .title {
        font-size: 42px;
    }
}

</style>
</head>
